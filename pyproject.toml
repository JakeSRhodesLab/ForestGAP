[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestgap"
version = "1.0.0"
description = "Composition-based sparse relations and applications for forest estimators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.5.0,<1.14",
    "scikit-learn==1.7.2",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
openml = ["openml"]
treeple = ["treeple==0.10.3"]
aeon = ["aeon"]
quantile = ["quantile-forest"]
survival = ["scikit-survival>=0.26,<0.27"]
phate = ["phate", "graphtools"]
umap = ["umap-learn"]
manifold = ["phate", "graphtools", "umap-learn"]
dev = [
    "build",
    "pytest",
    "nbclient",
    "nbformat",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
include = ["forestgap*"]

[tool.setuptools.package-data]
"forestgap.adapters" = ["fixtures/*.json"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/common.py" = ["E402"]
"experiments/run_imputation.py" = ["E402"]
"experiments/run_local_feature_importance.py" = ["E402"]
"experiments/run_prediction_identity.py" = ["E402"]
"experiments/run_prototypes.py" = ["E402"]
