[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestgap"
version = "0.1.0"
description = "Sparse proximity computations for random forest-like ensembles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.5.0,<1.14",
    "scikit-learn==1.7.2",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
openml = ["openml"]
treeple = ["treeple==0.10.3"]
phate = ["phate", "graphtools"]
umap = ["umap-learn"]
manifold = ["phate", "graphtools", "umap-learn"]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["forestgap*"]
