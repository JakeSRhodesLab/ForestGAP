[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestgap"
version = "0.1.0"
description = "Sparse proximity computations for random forest-like ensembles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.5.0,<1.14",
    "scikit-learn==1.7.2",
    "pandas",
    "matplotlib",
    "phate>=2.0.0",
    "aeon>=1.3.0",
    "treeple==0.10.3",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "notebook>=7.6.0",
    "jupyter>=1.1.1",
    "openml>=0.15.1",
]

[project.optional-dependencies]
openml = ["openml"]
treeple = ["treeple==0.10.3"]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["forestgap*"]
