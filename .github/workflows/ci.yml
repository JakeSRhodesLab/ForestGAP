name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and maintained optional adapters
        run: >-
          python -m pip install --upgrade pip build &&
          python -m pip install -e '.[dev,aeon,treeple,quantile,survival]'
      - name: Reject stale wrapper imports
        run: python scripts/check_removed_api.py
      - name: Run static checks
        run: python -m ruff check forestgap experiments scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Execute all maintained notebooks in clean kernels
        run: python scripts/validate_notebooks.py --execute
      - name: Verify distribution build
        run: python -m build
